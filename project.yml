name: Dayleft
options:
  minimumXcodeGenVersion: 2.46.0
  xcodeVersion: '26.6'
  deploymentTarget:
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
packages:
  DayleftCore:
    path: .
targets:
  Dayleft:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - Dayleft.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dayleft.Dayleft
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/Dayleft.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: DayleftCore
        product: DayleftCore
      - package: DayleftCore
        product: DayleftPresentation
schemes:
  Dayleft:
    build:
      targets:
        Dayleft: all
    run:
      config: Debug
    archive:
      config: Release
